<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Реал Лайф РПГ v9.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-background"></div>

    <!-- ... (Toast container and Auth screen are unchanged) ... -->
    <div class="toast-container" id="toast-container"></div>
    <div id="auth-screen" class="auth-container">
        <!-- ... -->
    </div>


    <!-- ===== ИГРА ===== -->
    <div id="game-container" class="game-container">
        <!-- ... (header and tabs are unchanged) ... -->
        <div class="header-bar">
            <!-- ... -->
        </div>
        <div class="tabs">
            <!-- ... -->
        </div>


        <!-- Главный экран (unchanged) -->
        <div id="main-screen" class="screen">
            <!-- ... -->
        </div>

        <!-- Квесты -->
        <div id="quests-screen" class="screen">
            <h2 class="section-title">Ежедневные квесты</h2>
            <div id="quests-container"></div>

            <div class="divider"></div>

            <h2 class="section-title">Конструктор квестов</h2>
            
            <div class="card">
                <h3>Готовые наборы</h3>
                <div class="presets-container" id="presets-container">
                    <button class="action-btn" data-action="apply-preset" data-preset="gym">Атлет</button>
                    <button class="action-btn" data-action="apply-preset" data-preset="it">IT-специалист</button>
                </div>
            </div>

            <div class="card">
                <h3>Добавить свой квест</h3>
                <div class="custom-quest-form">
                    <input type="text" id="custom-quest-title" placeholder="Название квеста">
                    <input type="text" id="custom-quest-desc" placeholder="Краткое описание">
                    <div class="form-row">
                        <select id="custom-quest-branch">
                            <option value="atletika">Атлетика</option>
                            <option value="intellekt">Интеллект</option>
                            <option value="disciplina">Дисциплина</option>
                        </select>
                        <select id="custom-quest-stat">
                            <!-- Options will be populated by JS -->
                        </select>
                    </div>
                    <div class="form-row">
                        <input type="number" id="custom-quest-points" placeholder="Очки XP" value="10">
                        <input type="number" id="custom-quest-gold" placeholder="Золото" value="15">
                    </div>
                    <button class="action-btn" data-action="add-custom-quest">Добавить в пул</button>
                </div>
            </div>
            
            <div class="card">
                <h3>Мой пул квестов</h3>
                <div id="custom-quests-pool-container">
                    <!-- Custom quests will be rendered here by JS -->
                </div>
            </div>
            
            <div class="divider"></div>

            <h2 class="section-title">Социальные квесты</h2>
            <div id="social-quests-container"></div>
        </div>

        <!-- ... (other screens are unchanged) ... -->
        <div id="goals-screen" class="screen">
            <!-- ... -->
        </div>
        <div id="shop-screen" class="screen">
            <!-- ... -->
        </div>
        <div id="achieve-screen" class="screen">
            <!-- ... -->
        </div>
    </div>

    <!-- ... (modals are unchanged) ... -->
    <div class="modal-overlay" id="goal-modal">
        <!-- ... -->
    </div>
    
    <script type="module" src="js/main.js"></script>
</body>
</html>
